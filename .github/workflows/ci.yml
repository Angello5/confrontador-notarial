name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: >-
          python -m pip install --require-hashes --only-binary :all:
          --no-binary antlr4-python3-runtime
          -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      sqlserver:
        # F63: la imagen Linux más antigua (no hay 2016); las pruebas fijan el
        # nivel de compatibilidad 130. Update this digest manually; Dependabot
        # does not manage services.image.
        image: mcr.microsoft.com/mssql/server:2017-latest@sha256:aeef07e21e24e51fdbf06d6f0c3c742b50c6cb59bb9c6209c53b27513d95f50b
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Test-only-passw0rd
          MSSQL_COLLATION: Modern_Spanish_100_CS_AS
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Test-only-passw0rd -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: test-only-not-a-secret
      DB_HOST: 127.0.0.1
      DB_PORT: "1433"
      # Solo para `check` y `makemigrations --check`; pytest crea su propia base.
      DB_NAME: master
      DB_USER: sa
      DB_PASSWORD: Test-only-passw0rd
      DB_TRUST_SERVER_CERTIFICATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install LibreOffice and ODBC Driver 18
        run: |
          sudo apt-get update
          if ! apt-cache madison msodbcsql18 | grep -q '18.7.1.1-1'; then
            curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
              https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
          fi
          sudo ACCEPT_EULA=Y apt-get install --yes --no-install-recommends libreoffice-writer fonts-liberation msodbcsql18=18.7.1.1-1
      - run: >-
          python -m pip install --require-hashes --only-binary :all:
          --no-binary antlr4-python3-runtime
          -r requirements.txt -r requirements-dev.txt
      - name: Verify public test resources
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from urllib.request import urlopen
          from adaptadores.extraccion import OCR_MODELS, _OCR_FILES

          OCR_MODELS.mkdir(parents=True, exist_ok=True)
          base = "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.4.0"
          downloads = {
              "ch_PP-OCRv5_mobile_det.onnx": f"{base}/onnx/PP-OCRv5/det/ch_PP-OCRv5_mobile_det.onnx",
              "latin_PP-OCRv5_rec_mobile_infer.onnx": f"{base}/onnx/PP-OCRv5/rec/latin_PP-OCRv5_rec_mobile_infer.onnx",
          }
          for name, url in downloads.items():
              with urlopen(url, timeout=60) as response:
                  (OCR_MODELS / name).write_bytes(response.read())
          for name, expected in _OCR_FILES.items():
              assert sha256((OCR_MODELS / name).read_bytes()).hexdigest() == expected

          base = "https://raw.githubusercontent.com/LibreOffice/dictionaries/32b006a2c22a4ac7e8ed3f03346f7b3d85a970a4/es/es_PE"
          for extension, expected in {
              ".aff": "d966cb748e4a688ed75ec84b50c0835ac438e5325ee4fce703a093794f9cba7e",
              ".dic": "1d810a0a319fee329000538cf4df76621bb71228172558b87490f8b9c19b9d75",
          }.items():
              path = Path.home() / ".cache/notaria-ocr" / ("es_PE" + extension)
              if path.exists():
                  content = path.read_bytes()
              else:
                  with urlopen(base + extension, timeout=30) as response:
                      content = response.read()
              assert sha256(content).hexdigest() == expected
              if not path.exists():
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content)
          PY
      - run: python scripts/generar_fixtures.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest --cov --cov-report=term --cov-report=xml:coverage.xml
      - run: python -c "import xml.etree.ElementTree as E; assert E.parse('coverage.xml').getroot().findall('.//class')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  sonar:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require SONAR_TOKEN
        run: |
          if [ "${{ secrets.SONAR_TOKEN != '' }}" != "true" ]; then
            echo "::error::SONAR_TOKEN is required"
            exit 1
          fi
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: >-
          python -m pip install --require-hashes --only-binary :all:
          --no-binary antlr4-python3-runtime
          -r requirements.txt -r requirements-dev.txt
      - run: python -m pip_audit --strict -r requirements.txt -r requirements-dev.txt -r requirements-sentido.txt

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks 8.28.0
        env:
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Select commit range
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "RANGO=-1 $HEAD" >> "$GITHUB_ENV"
          else
            echo "RANGO=$BASE..$HEAD" >> "$GITHUB_ENV"
          fi
      - run: |
          gitleaks dir --redact .
          gitleaks git --redact --log-opts="$RANGO"

  ci-required:
    needs: [lint, tests, sonar, dependencies, secrets]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ join(needs.*.result, ',') }}" = "success,success,success,success,success"
