sonar.organization=angello5
sonar.projectKey=Angello5_confrontador-notarial
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=test_*.py,tests/**/*.py
sonar.exclusions=test_*.py,tests/**,scripts/**,coverage.xml,.specify/**,.claude/**,.agents/**,specs/**,docs/**
# Constitución I: experimental/ queda fuera del ERP, no se despliega y sus tests son opt-in; mantenerlo en análisis SAST/bugs/secretos.
sonar.coverage.exclusions=experimental/**
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
