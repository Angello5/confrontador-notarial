# Catálogo de reglas del confrontador (Anexo A, capas 5 y 6).
# Cambiar una severidad o una regla exige incrementar `version`: cada corrida
# registra la versión con la que se calificaron sus hallazgos.
# Severidades [NEEDS CLARIFICATION]: ALTA datos de validación obligatoria,
# MEDIA reglas de persona y párrafos, BAJA lingüísticas.

version = "2026.10.09-11"
default_severidad = "MEDIA"

[reglas.NOMBRE]
descripcion = "Nombre del borrador distinto del nombre de las fuentes."
severidad = "ALTA"

[reglas.DNI]
descripcion = "DNI del borrador ausente de las fuentes o de longitud incorrecta."
severidad = "ALTA"

[reglas.PARTIDA]
descripcion = "Partida o ficha registral distinta de la de las fuentes."
severidad = "ALTA"

[reglas.MONTO]
descripcion = "Monto distinto del de las fuentes."
severidad = "ALTA"

[reglas.NUMERO_EN_LETRAS]
descripcion = "Número en letras distinto de su cifra entre paréntesis."
severidad = "ALTA"

[reglas.DOCUMENTO_CRUZADO]
descripcion = "Documento de identidad que pertenece a otra persona según las fuentes."
severidad = "ALTA"

[reglas.DOCUMENTO_SIN_TITULAR]
descripcion = "Documento de identidad que no pertenece a ninguna persona de las fuentes."
severidad = "ALTA"

[reglas.SIN_FICHA]
descripcion = "Nombre o DNI del borrador de una persona sin ficha RENIEC en los recaudos."
severidad = "MEDIA"

[reglas.NOMBRE_MARCA_AGUA]
descripcion = "Nombre que solo difiere de la ficha escaneada en una Ñ (posible marca de agua): verificar con el DNI."
severidad = "MEDIA"

[reglas.RUC]
descripcion = "RUC distinto del de las fuentes."
severidad = "ALTA"

[reglas.DIRECCION]
descripcion = "Dirección (domicilio o bien) distinta de la de las fuentes."
severidad = "ALTA"

[reglas.ESTADO_CIVIL_DISCREPANTE]
descripcion = "Estado civil del borrador distinto del de RENIEC."
severidad = "MEDIA"

[reglas.CONYUGE_NO_MENCIONADO]
descripcion = "Cónyuge de RENIEC no mencionado en el borrador."
severidad = "MEDIA"

[reglas.CONYUGE_BIEN_PROPIO]
descripcion = "Casado según RENIEC que interviene sin su cónyuge por declarar bien propio: confirmar."
severidad = "MEDIA"

[reglas.MENOR_DE_EDAD]
descripcion = "Compareciente menor de edad a la fecha de referencia."
severidad = "MEDIA"

[reglas.DOMICILIO_HABILITACION]
descripcion = "Domicilio que coincide salvo el tipo de habilitación (asentamiento humano, pueblo joven…)."
severidad = "MEDIA"

[reglas.DOMICILIO_NO_ENCONTRADO]
descripcion = "Domicilio de RENIEC no encontrado en el borrador."
severidad = "MEDIA"

[reglas.PARRAFO]
descripcion = "Párrafo de la minuta ausente o alterado en el borrador."
severidad = "MEDIA"

# F39: el ERP ya no ejecuta PARRAFO (lo usan app.py y app_ortografia.py)
[reglas.ANEXO]
descripcion = "Anexo de la minuta (hoja resumen, cronograma) omitido en el borrador."
severidad = "MEDIA"

[reglas.ORTOGRAFIA]
descripcion = "Palabra no reconocida por el diccionario es_PE ni la lista de la casa."
severidad = "BAJA"

# F30
[reglas.AREA]
descripcion = "Área en letras distinta de su cifra en metros cuadrados."
severidad = "ALTA"

[reglas.DATO_REGISTRAL]
descripcion = "Zona registral, registro, oficina o provincia distinta de la de las fuentes."
severidad = "ALTA"

[reglas.GENERO]
descripcion = "Tratamiento, participio o fórmula del notario en el género contrario al sexo de RENIEC."
severidad = "MEDIA"

[reglas.CORRELATIVO]
descripcion = "Cláusula o inciso que salta o repite su número."
severidad = "MEDIA"

[reglas.COPROPIEDAD]
descripcion = "Cuotas de copropiedad que no suman 100 %."
severidad = "MEDIA"

# F35
[reglas.RAZON_SOCIAL]
descripcion = "Razón social distinta de la de la ficha RUC de los recaudos."
severidad = "ALTA"

[reglas.DOMICILIO_FISCAL]
descripcion = "Domicilio de la empresa con números distintos de su ficha RUC."
severidad = "ALTA"

# F43: transferencia vehicular, contra la boleta informativa y los cheques.
[reglas.PLACA]
descripcion = "Placa del acta distinta de la boleta informativa, o ausente."
severidad = "ALTA"

[reglas.VEHICULO]
descripcion = "Característica del vehículo (marca, modelo, serie, VIN, motor, color, año) distinta de la boleta."
severidad = "ALTA"

[reglas.PROPIETARIO]
descripcion = "Transferente distinto del propietario registral de la boleta."
severidad = "ALTA"

[reglas.CHEQUE]
descripcion = "Importe o número de cheque del acta distinto de los cheques."
severidad = "ALTA"
