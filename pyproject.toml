[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["test_*.py", "tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
norecursedirs = [".git", ".venv", "tests/fixtures", "Cliente", "Proyecto*", "Resultado", "Plantilla", "expedientes", "expedientes_locales", "*-[0-9][0-9][0-9][0-9][0-9]"]
addopts = "--strict-markers -m 'not local_reference and not revisor_llm and not ocr_research'"
markers = [
    "local_reference: medición privada solo por selección explícita local",
    "revisor_llm: pruebas opt-in de la capa experimental, sin red ni modelos",
    "ocr_research: medicion OCR sintetica lenta y explicita, fuera de la suite ordinaria",
]

[tool.coverage.run]
relative_files = true
source = ["."]
omit = ["test_*.py", "tests/*", "scripts/*", ".venv/*", "experimental/*", "expedientes_locales/*"]

[tool.coverage.report]
show_missing = true
include = ["extraer.py", "verificar.py", "lexico.py", "ortografia.py", "nucleo/*.py", "adaptadores/*.py", "expedientes/**/*.py", "experimental/*.py", "config/*.py", "accounts/**/*.py", "core/*.py", "agente/**/*.py", "manage.py"]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py313"
extend-exclude = ["expedientes_locales", "tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]
"tests/**" = ["S101"]
