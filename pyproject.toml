[tool.pytest.ini_options]
testpaths = ["test_*.py", "tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
norecursedirs = [".git", ".venv", "tests/fixtures", "Cliente", "Proyecto*", "Resultado", "Plantilla", "expedientes", "*-[0-9][0-9][0-9][0-9][0-9]"]
addopts = "--strict-markers -m 'not local_reference'"
markers = ["local_reference: medición privada solo por selección explícita local"]

[tool.coverage.run]
relative_files = true
source = ["."]
omit = ["test_*.py", "tests/*", "scripts/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
include = ["extraer.py", "verificar.py", "lexico.py", "ortografia.py", "revisor_llm.py", "app.py", "app_ortografia.py", "bench_llm.py"]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]
"tests/**" = ["S101"]
