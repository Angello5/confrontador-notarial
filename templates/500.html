<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema no disponible</title>
  <!-- F8: Django la usa sin contexto cuando falla una petición (por ejemplo, sin conexión con la base). -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb; color: #0f2765; font-family: "Segoe UI", Arial, sans-serif; }
    main { max-width: 32rem; padding: 2.5rem; background: #fff; border-top: 4px solid #e0a400; box-shadow: 0 8px 24px rgba(15, 39, 101, 0.12); }
    h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }
    p { margin: 0; font-size: 1.05rem; line-height: 1.6; color: #44506b; }
  </style>
</head>
<body>
  <main role="alert">
    <h1>El sistema no está disponible</h1>
    <p>No se pudo completar la operación. Intente de nuevo en unos minutos; si el problema continúa, avise al encargado de sistemas.</p>
  </main>
</body>
</html>
