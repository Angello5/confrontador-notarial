{% if por_volver_a_subir %}
<section class="aviso" role="status" aria-labelledby="volver-a-subir">
  <svg class="ico" aria-hidden="true"><use href="#i-info"/></svg>
  <div class="aviso-texto">
    <strong id="volver-a-subir">Algunos documentos se leyeron con una versión anterior del sistema.</strong>
    <span>Elimínelos y vuelva a subirlos para aplicar las mejoras de lectura.</span>
    <ul>
      {% for documento in por_volver_a_subir %}<li>{{ documento.nombre_original }}</li>{% endfor %}
    </ul>
  </div>
</section>
{% endif %}
