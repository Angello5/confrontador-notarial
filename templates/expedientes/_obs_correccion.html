{% comment %}
F65: casilla compacta de la fila, ligada a la observación `prefijo` + `numero`
(se empareja por el valor erróneo en el JS de confrontacion.html). Marca o
desmarca la misma corrección que se envía en «Aplicar correcciones».
{% endcomment %}
<template x-if="corrDe('{{ prefijo }}{{ numero }}')">
  <div class="obs-correccion">
    {% if resultado.corregible %}
      <label class="casilla casilla-chica" title="Se aplica a todas sus apariciones compatibles en el Word.">
        <input type="checkbox" :checked="marcadas.includes(corrDe('{{ prefijo }}{{ numero }}').id)" @change="alternar(corrDe('{{ prefijo }}{{ numero }}').id)">
        <span class="casilla-caja"><svg class="ico" aria-hidden="true"><use href="#i-check"/></svg></span>
        <span>Corregir en el Word<span class="texto-suave" x-text="' · ' + corrDe('{{ prefijo }}{{ numero }}').apariciones"></span></span>
      </label>
    {% else %}
      <p class="texto-suave texto-chico">Este borrador no admite corrección automática.</p>
    {% endif %}
  </div>
</template>
