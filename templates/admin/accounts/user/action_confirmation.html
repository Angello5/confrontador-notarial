{% extends "admin/base_site.html" %}
{% load i18n %}
{% block content %}
<h1>{{ title }}</h1>
<p>La acción cambiará el estado de las cuentas seleccionadas. ¿Desea continuar?</p>
<form method="post">
  {% csrf_token %}
  <input type="hidden" name="action" value="{{ action_name }}">
  <input type="hidden" name="post" value="yes">
  {% for user in queryset %}
    <input type="hidden" name="_selected_action" value="{{ user.pk }}">
  {% endfor %}
  <button type="submit" class="default">Confirmar</button>
  <a href="../">Cancelar</a>
</form>
{% endblock %}
